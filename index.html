<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="T-Interview: Multi-Profession Interview Preparation Platform for Cybersecurity, Software Engineering, Project Management and more.">
  <meta name="theme-color" content="#0a0e17">
  <title>T-Interview | Multi-Profession Interview Preparation</title>
  
  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Header & Navigation -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-group">
        <div class="brand-logo" aria-hidden="true">T</div>
        <div>
          <span class="brand-title">T-Interview</span>
          <span class="brand-badge" id="brand-track-badge">Cybersecurity</span>
        </div>
      </div>

      <div class="header-selectors">
        <!-- Track Dropdown -->
        <select id="track-select" class="dropdown-select" aria-label="Select Professional Track">
          <option value="cybersecurity">Cybersecurity</option>
          <option value="software-engineering">Software Engineering</option>
          <option value="project-management">Project Management</option>
        </select>

        <!-- Level Dropdown -->
        <select id="level-select" class="dropdown-select" aria-label="Select Seniority Level">
          <option value="intern">Intern</option>
          <option value="junior">Junior</option>
          <option value="intermediate">Intermediate</option>
          <option value="senior">Senior</option>
        </select>
      </div>

      <div class="search-container">
        <input 
          type="search" 
          id="search-input" 
          class="search-input" 
          placeholder="Search topics, questions, tags..." 
          aria-label="Search questions"
        >
      </div>

      <div class="header-actions">
        <div class="mode-selector" role="tablist" aria-label="Study Mode Selection">
          <button class="mode-button active" data-mode="flashcards" role="tab" aria-selected="true">
            <span>Flashcards</span>
          </button>
          <button class="mode-button" data-mode="reading" role="tab" aria-selected="false">
            <span>Deep Dive</span>
          </button>
        </div>
        <button class="btn-icon" id="theme-toggle" title="Toggle Theme" aria-label="Toggle Dark/Light Mode">
          🌓
        </button>
      </div>
    </div>
  </header>

  <!-- Category Filter Bar -->
  <nav class="filter-bar" id="category-filter-bar" aria-label="Category Filters">
    <!-- Rendered dynamically by JavaScript -->
  </nav>

  <!-- Main View Area -->
  <main class="main-wrapper" id="main-content" role="region" aria-live="polite">
    <!-- Rendered dynamically by JavaScript -->
  </main>

  <!-- Application Entry Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
