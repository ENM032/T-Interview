<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="T-Interview: Professional technical interview preparation with accessible progressive disclosure.">
  <meta name="theme-color" content="#0a0e17">
  <title>T-Interview | Technical Interview Preparation</title>
  
  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-group">
        <div class="brand-logo" aria-hidden="true">T</div>
        <div>
          <span class="brand-title">T-Interview</span>
        </div>
      </div>

      <div class="header-controls">
        <!-- Track Selector -->
        <select id="track-select" class="dropdown-select" aria-label="Select Professional Track">
          <option value="cybersecurity">Cybersecurity</option>
          <option value="software-engineering">Software Engineering</option>
          <option value="project-management">Project Management</option>
        </select>

        <!-- Level Selector -->
        <select id="level-select" class="dropdown-select" aria-label="Select Seniority Level">
          <option value="intern">Intern</option>
          <option value="junior">Junior</option>
          <option value="intermediate">Intermediate</option>
          <option value="senior">Senior</option>
        </select>

        <!-- Theme Toggle -->
        <button class="btn-icon" id="theme-toggle" title="Toggle Theme" aria-label="Toggle Dark/Light Mode">
          🌓
        </button>
      </div>
    </div>
  </header>

  <!-- 3-Column Progressive Disclosure Layout -->
  <div class="app-layout">
    <!-- Left Sidebar: Modules & Search -->
    <aside class="sidebar-left" id="sidebar-left" aria-label="Navigation and Progress">
      <!-- Rendered dynamically by JavaScript -->
    </aside>

    <!-- Center Pane: Main Content & Reading -->
    <main class="content-center" id="main-content" role="region" aria-live="polite">
      <!-- Rendered dynamically by JavaScript -->
    </main>

    <!-- Right Sidebar: Stats, Tools & Keyboard Shortcuts -->
    <aside class="sidebar-right" id="sidebar-right" aria-label="Study Tools and Stats">
      <!-- Rendered dynamically by JavaScript -->
    </aside>
  </div>

  <!-- Application Entry Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
